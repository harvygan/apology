<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit clouds memory placeholder</title>
  <desc id="desc">A lavender night sky placeholder with moonlight and clouds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#120520"/>
      <stop offset=".55" stop-color="#522082"/>
      <stop offset="1" stop-color="#b989e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="806" cy="220" r="112" fill="#fff8ff" opacity=".86"/>
  <circle cx="852" cy="190" r="112" fill="#4b1c7a"/>
  <g fill="#fff8ff" opacity=".22">
