<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Romantic lights memory placeholder</title>
  <desc id="desc">A placeholder image with warm romantic lights on a purple background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#290643"/>
      <stop offset=".56" stop-color="#7a2aa2"/>
      <stop offset="1" stop-color="#ff8fbe"/>
    </linearGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#fff8ff" stop-opacity=".9"/>
      <stop offset=".44" stop-color="#ffc3dd" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffc3dd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <path d="M0 250 C250 350 416 120 660 214 C842 284 948 258 1200 120" fill="none" stroke="#fff8ff" stroke-opacity=".46" stroke-width="8"/>
  <g>
    <circle cx="130" cy="280" r="70" fill="url(#light)"/>
    <circle cx="356" cy="230" r="84" fill="url(#light)"/>
    <circle cx="602" cy="208" r="72" fill="url(#light)"/>
    <circle cx="832" cy="270" r="82" fill="url(#light)"/>
    <circle cx="1058" cy="188" r="74" fill="url(#light)"/>
  </g>
  <rect x="120" y="566" width="960" height="178" rx="8" fill="#fff8ff" opacity=".12"/>
  <text x="72" y="120" fill="#fff8ff" font-family="Poppins, Arial, sans-serif" font-size="54" font-weight="700">Favorite Memory</text>
</svg>
